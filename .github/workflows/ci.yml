name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Syntax check all scripts
        run: |
          for f in scripts/*.js; do node --check "$f"; done

      - name: Validate JSON and manifest references
        run: node tests/validate-json.mjs

      - name: Smoke test with mocked Foundry API
        run: node tests/smoke.mjs
